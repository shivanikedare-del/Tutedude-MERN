<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="project.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <title>Seven by M.S. Dhoni: Women's Hogun multi color running shoes</title>
</head>

<body>

    <section class="flex-row">

        <div class="checkout-left">
            <p class="paragraph">Checkout</p>

            <h2>Contact Details</h2>
            <br>

            <label>Email Id <input class="pay-details" type="email" placeholder="John Doe"></label>
            <br>

            <h2>Payment</h2>
            <br>

            <div class="bill">
                <label>Card number <input class="pay-details" type="number" placeholder="John Doe"></label>
                <br>

                <div>
                    <label>Expiry <input class="pay-details" type="date" placeholder="MM/YY"></label>
                    <br>

                    <label>CVV <input class="pay-details" type="password" placeholder="***"></label>
                    <br>
                </div>

                <div>
                    <label>Country <input class="pay-details" type="text" placeholder="India"></label>
                    <br>

                    <label>ZIP <input class="pay-details" type="number" placeholder="XXX XXX"></label>
                    <br>
                </div>

            </div>
        </div>


        <div class="summary-right">
            <h2>Order Summary</h2>
            <br>

            <div class="bill">
                <label>
                    <h5>Enter Coupon Code</h5><input type="text" placeholder="COUPON CODE">
                </label>
                <button class="coupon-apply">Apply Coupon</button>

                <br>
                <div class="bill-price flex-row">
                    <ul type="none">
                        <li class="paragraph">Sub Total</li>
                        <li class="paragraph">Taxes (if applicable)</li>
                        <li class="paragraph">Discount</li>
                        <li>
                            <h3>Total</h3>
                        </li>
                    </ul>

                    <ul type="none">
                        <li class="paragraph">₹4,800</li>
                        <li class="paragraph">₹199</li>
                        <li class="paragraph">₹0</li>
                        <li>
                            <h3>₹4,999</h3>
                        </li>
                    </ul>
                </div>

            </div>


            <br>

            <button class="cart-button pay-button">Pay Now ₹4,999</button>
            <br>

            <div class="flex-row hero-section">
                <img class="secure"
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTYkbcwtXduP4OFSjcudzUoCt08nMvx-IPiKV9nQ64J&s=10">
            </div>

        </div>
    </section>

</body>

</html>
